name: Release

# 버전 태그(예: 0.5.2)를 push하면 테스트·빌드 후 GitHub Release를 만든다.
# 플러그인의 자동 업데이트는 이 Release의 main.js·manifest.json·styles.css를 내려받는다.
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: 태그와 manifest 버전 일치 확인
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$MANIFEST_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "태그($GITHUB_REF_NAME)와 manifest.json 버전($MANIFEST_VERSION)이 다릅니다"
            exit 1
          fi

      - name: Release 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
